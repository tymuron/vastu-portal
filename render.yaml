services:
  - type: web
    name: vastu-portal
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Server-side only (used by /api/lava/webhook)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LAVA_WEBHOOK_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      # Purchase fulfilment (fulfilment.js)
      - key: LAVA_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: ACCESS_LINK_SECRET
        sync: false
      - key: RECONCILE_SINCE
        sync: false
      # GetCourse orders -> access (/api/getcourse/order?key=...)
      - key: GETCOURSE_WEBHOOK_KEY
        sync: false
      # monobank «Покупка частинами» (mono.js)
      - key: MONO_STORE_ID
        sync: false
      - key: MONO_SIGN_KEY
        sync: false
      - key: MONO_PRICES_UAH
        sync: false
      - key: MONO_PARTS
        sync: false
