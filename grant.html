<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<meta name="robots" content="noindex" />
<title>Выдать доступ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100vh; background:#F2EDE2; color:#422326;
    font-family:Georgia,'Times New Roman',serif; padding:24px 16px 48px; }
  .card { width:100%; max-width:560px; margin:0 auto; }
  h1 { font-size:26px; font-weight:400; font-style:italic; text-align:center; margin:8px 0 4px; }
  h2 { font-size:20px; font-weight:400; font-style:italic; margin:40px 0 4px; }
  .sub { text-align:center; font-size:11px; letter-spacing:.28em;
    text-transform:uppercase; color:#8a6a3b; margin-bottom:28px; }
  label { display:block; font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; color:#8a6a3b; margin:18px 0 6px; }
  input[type=email], input[type=password] { width:100%; padding:14px; font-size:16px;
    font-family:inherit; color:#422326; background:#fff;
    border:1px solid #d9c9a8; border-radius:8px; outline:none; }
  input:focus { border-color:#8a6a3b; }
  .tiers { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .tier { text-align:center; padding:12px 8px; border:1px solid #d9c9a8;
    border-radius:8px; background:#fff; cursor:pointer; font-size:14px; line-height:1.3; }
  .tier.on { background:#422326; color:#F2EDE2; border-color:#422326; }
  .check { display:flex; gap:10px; align-items:center; margin-top:18px; font-size:15px;
    text-transform:none; letter-spacing:0; color:#422326; line-height:1.4; }
  .check input { width:20px; height:20px; accent-color:#422326; }
  button { width:100%; margin-top:24px; padding:16px; font-size:15px;
    font-family:inherit; letter-spacing:.16em; text-transform:uppercase;
    color:#F2EDE2; background:#422326; border:1px solid #422326;
    border-radius:8px; cursor:pointer; }
  button.small { width:auto; margin:8px 0 0; padding:8px 12px; font-size:11px; letter-spacing:.12em; }
  button.ghost { background:#fff; color:#422326; border-color:#d9c9a8; }
  button:disabled { opacity:.5; }
  .msg { margin-top:20px; padding:14px; border-radius:8px; font-size:15px; text-align:center; display:none; }
  .ok { background:#e3efe0; color:#2f5a2a; display:block; }
  .err { background:#f4e0e0; color:#7a2a2a; display:block; }
  .warn { background:#f6ead0; color:#6b4a12; padding:12px 14px; border-radius:8px; font-size:14px; margin-top:12px; line-height:1.5; }
  textarea { width:100%; height:150px; padding:12px; font-size:14px; font-family:inherit;
    color:#422326; background:#fff; border:1px solid #d9c9a8; border-radius:8px; resize:none; }
  .meta { font-size:13px; color:#7a5a3a; line-height:1.5; }
  .row { background:#fff; border:1px solid #e3d7bd; border-radius:8px; padding:12px 14px; margin-top:10px; }
  .row .top { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .row .mail { font-size:15px; word-break:break-all; }
  .chip { display:inline-block; font-size:11px; letter-spacing:.06em; padding:3px 8px; border-radius:20px; margin:6px 6px 0 0; }
  .chip.g { background:#e3efe0; color:#2f5a2a; }
  .chip.r { background:#f4e0e0; color:#7a2a2a; }
  .chip.y { background:#f6ead0; color:#6b4a12; }
  .err-text { font-size:12px; color:#7a2a2a; margin-top:6px; word-break:break-word; }
  .secret-row { margin-top:32px; font-size:13px; text-align:center; }
  .secret-row a { color:#8a6a3b; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>Выдать доступ</h1>
    <div class="sub">Anna Romeo · Админ</div>

    <div id="setup">
      <label>Секретный ключ (вводится один раз)</label>
      <input id="secret" type="password" placeholder="CRON_SECRET" autocomplete="off" />
      <button onclick="saveSecret()">Сохранить ключ</button>
    </div>

    <div id="form" style="display:none">
      <div id="warnings"></div>

      <label>Email клиента</label>
      <input id="email" type="email" placeholder="client@example.com" autocomplete="off" autocapitalize="off" />

      <label>Тариф</label>
      <div class="tiers" id="tiers"></div>

      <label class="check"><input id="sendmail" type="checkbox" checked /> Отправить клиенту письмо с доступом и ссылками на Telegram</label>

      <button id="go" onclick="grant()">Выдать доступ</button>
      <div id="msg" class="msg"></div>
      <div id="share" style="display:none;margin-top:16px;">
        <label>Сообщение для клиента</label>
        <textarea id="sharetext" readonly></textarea>
        <button id="copybtn" onclick="copyShare()" style="margin-top:10px;">Скопировать сообщение</button>
      </div>

      <h2>Оплаты</h2>
      <div class="meta" id="recon">…</div>
      <button class="small ghost" id="reconbtn" onclick="reconcileNow()">Проверить оплаты на lava.top сейчас</button>
      <div id="purchases"></div>

      <div class="secret-row"><a onclick="forgetSecret()">Сменить секретный ключ</a></div>
    </div>
  </div>

<script>
  var KEY = 'vastu_grant_secret';
  var tier = null;

  function secret() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function api(method, url, body) {
    return fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json', 'x-cron-secret': secret() },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { s: r.status, d: d }; }); });
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function when(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function refresh() {
    var s = secret();
    document.getElementById('setup').style.display = s ? 'none' : 'block';
    document.getElementById('form').style.display = s ? 'block' : 'none';
    if (s) { loadTiers(); loadStatus(); loadPurchases(); }
  }
  function saveSecret() {
    var v = document.getElementById('secret').value.trim();
    if (!v) return;
    try { localStorage.setItem(KEY, v); } catch (e) {}
    document.getElementById('secret').value = '';
    refresh();
  }
  function forgetSecret() { try { localStorage.removeItem(KEY); } catch (e) {} refresh(); }

  function loadTiers() {
    api('GET', '/api/admin/tiers').then(function (x) {
      if (x.s === 401) return badSecret();
      var box = document.getElementById('tiers');
      box.innerHTML = '';
      (x.d.tiers || []).forEach(function (t, i) {
        var el = document.createElement('div');
        el.className = 'tier' + (i === 0 ? ' on' : '');
        el.textContent = t.label;
        el.onclick = function () { pick(el, t.key); };
        if (i === 0) tier = t.key;
        box.appendChild(el);
      });
    });
  }
  function pick(el, key) {
    tier = key;
    document.querySelectorAll('.tier').forEach(function (t) { t.classList.remove('on'); });
    el.classList.add('on');
  }
  function badSecret() {
    var msg = document.getElementById('msg');
    msg.className = 'msg err';
    msg.textContent = 'Неверный секретный ключ. Смените его внизу страницы.';
  }

  function loadStatus() {
    api('GET', '/api/admin/status').then(function (x) {
      if (x.s !== 200) return;
      var w = document.getElementById('warnings');
      var out = '';
      if (x.d.missingWelcomeLinks && x.d.missingWelcomeLinks.length)
        out += '<div class="warn">В письмах покупателям не хватает ссылок Telegram: ' + esc(x.d.missingWelcomeLinks.join(', ')) + '</div>';
      if (!x.d.alertEmail)
        out += '<div class="warn">Не задан ALERT_EMAIL — о сбоях никто не узнает.</div>';
      if (!x.d.reconcile.enabled)
        out += '<div class="warn">Сверка с lava.top выключена (нет RECONCILE_SINCE) — если вебхук не дойдёт, оплату никто не подхватит.</div>';
      w.innerHTML = out;
      var r = x.d.reconcile.last;
      document.getElementById('recon').innerHTML = r
        ? 'Последняя сверка с lava.top: ' + esc(when(r.finishedAt)) + ' — оплат найдено ' +
          (r.paidInvoices || 0) +
          ', обработано новых ' + (r.fulfilled || []).length +
          (r.errors && r.errors.length ? ', <b>ошибок ' + r.errors.length + '</b>' : '')
        : 'Сверка с lava.top ещё не запускалась.';
    });
  }

  function chip(cls, text) { return '<span class="chip ' + cls + '">' + esc(text) + '</span>'; }
  function loadPurchases() {
    api('GET', '/api/admin/purchases').then(function (x) {
      var box = document.getElementById('purchases');
      if (x.s !== 200) { box.innerHTML = ''; return; }
      if (!x.d.purchases.length) { box.innerHTML = '<div class="meta" style="margin-top:12px">Оплат пока нет.</div>'; return; }
      box.innerHTML = x.d.purchases.map(function (p) {
        var access = p.status === 'granted' ? chip('g', 'доступ ✓')
          : p.status === 'unmapped' ? chip('r', 'не привязана к курсу')
          : p.status === 'processing' ? chip('y', 'в обработке')
          : chip('r', 'ошибка доступа');
        var mail = p.email_sent_at ? chip('g', 'письмо ✓ ' + when(p.email_sent_at))
          : p.email_skipped_reason ? chip('y', 'повторная оплата, письмо не нужно')
          : p.source === 'manual' && p.status === 'granted' && !p.email_error ? chip('y', 'без письма')
          : chip('r', 'письмо не ушло');
        var src = { webhook: 'вебхук', poll: 'сверка lava', manual: 'вручную' }[p.source] || p.source;
        var err = p.error || p.email_error;
        return '<div class="row"><div class="top"><span class="mail">' + esc(p.email) + '</span>' +
          '<span class="meta">' + esc(when(p.created_at)) + '</span></div>' +
          '<div class="meta">' + esc((p.course_slugs || []).join(', ') || '—') + ' · ' + esc(src) +
          (p.amount ? ' · ' + esc(p.amount) + ' ' + esc(p.currency || '') : '') + '</div>' +
          access + mail +
          (err ? '<div class="err-text">' + esc(err) + '</div>' : '') +
          '<button class="small ghost" data-id="' + esc(p.contract_id).replace(/"/g, '&quot;') + '" onclick="retry(this.dataset.id, this)">' +
          (p.email_sent_at ? 'Отправить письмо ещё раз' : 'Повторить') + '</button></div>';
      }).join('');
    });
  }
  function retry(id, btn) {
    btn.disabled = true; btn.textContent = 'Отправляем…';
    api('POST', '/api/admin/purchases/retry', { contractId: id }).then(function (x) {
      btn.disabled = false;
      btn.textContent = x.s === 200 && x.d.email && x.d.email.sent ? 'Отправлено ✓' : 'Ошибка: ' + (x.d.error || x.d.status || x.s);
      setTimeout(loadPurchases, 1500);
    });
  }
  function reconcileNow() {
    var b = document.getElementById('reconbtn');
    b.disabled = true; b.textContent = 'Проверяем…';
    api('POST', '/api/cron/reconcile').then(function () {
      b.disabled = false; b.textContent = 'Проверить оплаты на lava.top сейчас';
      loadStatus(); loadPurchases();
    });
  }

  function copyShare() {
    var ta = document.getElementById('sharetext');
    var btn = document.getElementById('copybtn');
    ta.select(); ta.setSelectionRange(0, 99999);
    var done = function () { btn.textContent = 'Скопировано ✓';
      setTimeout(function () { btn.textContent = 'Скопировать сообщение'; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(done, function () {
        try { document.execCommand('copy'); done(); } catch (e) {}
      });
    } else {
      try { document.execCommand('copy'); done(); } catch (e) {}
    }
  }
  function grant() {
    var email = document.getElementById('email').value.trim();
    var msg = document.getElementById('msg');
    var btn = document.getElementById('go');
    msg.className = 'msg'; msg.textContent = '';
    if (!email) { msg.className = 'msg err'; msg.textContent = 'Введите email'; return; }
    if (!tier) { msg.className = 'msg err'; msg.textContent = 'Выберите тариф'; return; }
    btn.disabled = true; btn.textContent = 'Выдаём…';
    api('POST', '/api/admin/grant-access', {
      email: email, tier: tier, sendEmail: document.getElementById('sendmail').checked
    }).then(function (x) {
      btn.disabled = false; btn.textContent = 'Выдать доступ';
      if (x.s === 200 && x.d.granted) {
        msg.className = 'msg ok';
        msg.textContent = '✓ Доступ выдан: ' + x.d.email + ' — курсы: ' + (x.d.courses || []).join(', ') +
          (x.d.emailSent ? ' · письмо отправлено' : x.d.emailError ? ' · письмо НЕ ушло: ' + x.d.emailError : ' · без письма');
        document.getElementById('email').value = '';
        var share = document.getElementById('share');
        var ta = document.getElementById('sharetext');
        if (x.d.loginLink) {
          ta.value = 'Здравствуйте! Ваш доступ к курсу открыт 🤍\n\n' +
            'Перейдите по ссылке, чтобы задать пароль и войти:\n' +
            x.d.loginLink + '\n\n' +
            'Дальше заходите на ' + location.host + '/login с вашей почтой и паролем. ' +
            'Если что-то не открывается — напишите мне.';
          share.style.display = 'block';
        } else {
          ta.value = ''; share.style.display = 'none';
        }
        loadPurchases();
      } else if (x.s === 401) {
        badSecret();
      } else {
        msg.className = 'msg err';
        msg.textContent = 'Ошибка: ' + (x.d.error || ('код ' + x.s));
      }
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'Выдать доступ';
      msg.className = 'msg err'; msg.textContent = 'Сбой сети, попробуйте ещё раз';
    });
  }
  refresh();
</script>
</body>
</html>
